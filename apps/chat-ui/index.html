<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Felix chat</title>
    <!--
      Generated by `pnpm sync:brand` from packages/design/src/mark.ts. The SVG
      link is the one presence.ts repaints with the run's state; the .ico and
      touch icon are the static fallbacks for clients that read neither.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      Theme before first paint. ThemeProvider toggles `.dark` from an effect,
      which runs after React's first commit — so without this a dark-theme
      visitor got one light frame on every load. Same storage key and the same
      `system` fallback as src/components/theme-provider.tsx; the provider's
      effect then finds the class already set and changes nothing.
      Wrapped in try/catch because localStorage throws in some private modes.
    -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('felix.theme');
          const dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
