<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` lets the page draw under the notch and the home indicator;
      the `*-safe` utilities in src/index.css are what keep content clear of them, so
      the two only make sense together. `interactive-widget` asks Chromium to shrink
      the layout viewport for the on-screen keyboard; Safari ignores it, which is what
      src/hooks/use-visual-viewport.ts is for.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      Browser chrome (Safari's toolbar, an installed app's status bar) follows the
      page. These are the `--background` tokens as sRGB; the script below and
      ThemeProvider overwrite both with the theme actually applied, so an explicit
      choice in the header menu wins over the OS setting the media queries read.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Felix" />
    <!-- Draws the page behind the status bar when installed; the header's `pt-safe` clears it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Felix chat</title>
    <!--
      Generated by `pnpm sync:brand` from packages/design/src/mark.ts. The SVG
      link is the one presence.ts repaints with the run's state; the .ico and
      touch icon are the static fallbacks for clients that read neither.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      Theme before first paint. ThemeProvider toggles `.dark` from an effect,
      which runs after React's first commit — so without this a dark-theme
      visitor got one light frame on every load. Same storage key and the same
      `system` fallback as src/components/theme-provider.tsx; the provider's
      effect then finds the class already set and changes nothing.
      Wrapped in try/catch because localStorage throws in some private modes.
    -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('felix.theme');
          const dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
            meta.setAttribute('content', dark ? '#09090b' : '#ffffff');
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
