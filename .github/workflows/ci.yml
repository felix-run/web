name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every check runs even when an earlier one fails, so a red build reports
      # all of its problems in one go instead of one per push.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Type-check
        if: ${{ !cancelled() }}
        run: pnpm check-types

      # turbo builds every package with a build script: chat-ui, float, and docs.
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

      # The repo has no application test suite; this is the guard that keeps the
      # branch-protection hook honest, and it caught a real regression once.
      - name: Hook tests
        if: ${{ !cancelled() }}
        run: .claude/hooks/tests/block-main-commit.test.sh
