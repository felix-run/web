name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, stated here rather than inherited from a repository setting.
permissions:
  contents: read

# A newer push supersedes a PR's run. On main every merge keeps its run: deploy.yml starts from
# a successful CI run on main, so a cancelled one would leave that merge undeployed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The terminal client renders through a native core reached over FFI,
      # which Node has only behind an experimental flag. Its rendering tests run
      # under Bun; everything else in the repo stays on Node.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - run: pnpm install --frozen-lockfile

      # Every check runs even when an earlier one fails, so a red build reports
      # all of its problems in one go instead of one per push.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Type-check
        if: ${{ !cancelled() }}
        run: pnpm check-types

      # The wire contract is hand-mirrored across two apps and a separate repo,
      # so nothing else notices when the harness renames or drops a route.
      - name: API drift
        if: ${{ !cancelled() }}
        run: pnpm check-api-drift

      # `StreamEvent` ends in an open arm, so an event with no handler compiles,
      # lints, and silently does nothing. The type system cannot catch it.
      - name: Protocol parity
        if: ${{ !cancelled() }}
        run: pnpm check-protocol-parity

      # A class Tailwind never scanned generates no rule, and nothing else in the
      # pipeline notices: the build succeeds and the component renders unstyled.
      - name: Tailwind sources
        if: ${{ !cancelled() }}
        run: pnpm check-tailwind-sources

      # The run-state ramp is authored as oklch in chat-ui's stylesheet and frozen
      # as hex in @felix/design for the terminal. Both compile either way, so a
      # change to one shows up only as the two clients painting a state
      # differently — in two places nobody diffs side by side.
      - name: State palette
        if: ${{ !cancelled() }}
        run: pnpm check-state-palette

      # A response field the harness spells differently is `undefined` at runtime
      # and nothing above sees it: the cast typechecks and the route is right.
      - name: Payload shapes
        if: ${{ !cancelled() }}
        run: pnpm check-payload-shapes

      # turbo builds every package with a build script: chat-ui, docs and the tui.
      # The docs build normally downloads the spec of the release api.felix.run
      # runs; a PR build uses the committed snapshot so it does not hang on the
      # network. The real download is what reference-freshness.yml checks.
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build
        env:
          FELIX_OPENAPI_SPEC: ${{ github.workspace }}/apps/chat-ui/harness-openapi.json

      # What chat-ui loads before it can draw anything. KaTeX and rehype-raw each
      # rode into it on one static import inside a dependency, and nothing above
      # notices that: it type-checks, lints and renders the same.
      - name: Bundle budget
        if: ${{ !cancelled() }}
        run: pnpm check-bundle-budget

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

      # Separate from `pnpm test`: these exercise the .claude/ hooks rather than
      # workspace packages, and one of them caught a real regression.
      - name: Hook tests
        if: ${{ !cancelled() }}
        run: .claude/hooks/tests/block-main-commit.test.sh
